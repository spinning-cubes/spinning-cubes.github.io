    <script>
        // --- 1. Built-in Array of Entire Separate GeoJSON Objects ---
        const thing=[{type:"FeatureCollection",name:"Cahoon Farm Rd Walden VT — Historical Military Paths",features:[{type:"Feature",geometry:{type:"LineString",coordinates:[[-72.0617,44.1517],[-72.075,44.19],[-72.0993,44.2281],[-72.11,44.28],[-72.1217,44.3139],[-72.135,44.35],[-72.1469,44.3817],[-72.182,44.4108],[-72.205,44.435],[-72.215,44.445],[-72.22,44.458],[-72.23,44.47],[-72.238,44.478],[-72.255,44.485],[-72.315,44.505],[-72.2954,44.5453],[-72.34,44.59],[-72.38,44.6267],[-72.43,44.68],[-72.4883,44.7183],[-72.5617,44.7917],[-72.6117,44.8317]]},properties:{name:"Bayley-Hazen Military Road — Continental Army (1776–1779)",era:"1776–1779",direction:"South → North: Wells River to Hazen's Notch",commanders:"Col. Jacob Bayley / Gen. Moses Hazen",force:"Continental Army, ~200–400 soldiers",purpose:"Military road construction to enable invasion of Canada. Soldiers also built and garrisoned a log blockhouse in Walden (20×40 ft, stone chimney, sharpened abatis).",cahoon_farm_connection:"DIRECT — This road was cut through what is now Cahoon Farm Rd. The Walden blockhouse stood on or immediately adjacent to this location. Continental soldiers wintered here 1779–1780.",key_events:"Blockhouse built 1779; soldiers garrisoned winter 1779–1780; road used as invasion corridor for British raids 1780–1782; scouts Bliss & Sleeper killed at Greensboro (on this road) Sept 1781; British kidnap attempt on Gen. Bayley used this road June 1782.",stroke:"#C0392B","stroke-width":4,"stroke-opacity":.9}},{type:"Feature",geometry:{type:"LineString",coordinates:[[-72.85,45.1],[-72.7,44.95],[-72.6117,44.8317],[-72.5617,44.7917],[-72.4883,44.7183],[-72.38,44.6267],[-72.2954,44.5453],[-72.315,44.505],[-72.255,44.485],[-72.238,44.478],[-72.23,44.47],[-72.22,44.458],[-72.215,44.445],[-72.182,44.4108],[-72.1469,44.3817],[-72.1217,44.3139],[-72.0993,44.2281]]},properties:{name:"British Raiding Corridor — Hazen Road (1780–1782)",era:"1780–1782",direction:"North → South: Quebec border to Peacham & Newbury",commanders:"Unknown British officers + Kahnawake Mohawk & Iroquois warriors",force:"Small British ranger units + Iroquois war parties",purpose:"After discovering the American-built road, British forces repurposed it as an invasion and raiding corridor into Vermont settlements.",cahoon_farm_connection:"DIRECT — Raiders traveled along what is now Cahoon Farm Rd, passing the Walden blockhouse. The road through the property was the literal route used.",key_events:"Road discovered by British 1780; two soldiers captured at Peacham March 1781; scouts Constant Bliss and Moses Sleeper killed at Greensboro Sept 1781; kidnap attempt on Gen. Jacob Bayley at Newbury June 1782.",stroke:"#7D3C98","stroke-width":4,"stroke-opacity":.9}},{type:"Feature",geometry:{type:"LineString",coordinates:[[-72.5317,43.8217],[-72.515,43.895],[-72.505,43.985],[-72.4233,44.0583],[-72.4617,44.1933],[-72.51,44.26],[-72.47,44.38],[-72.38,44.42],[-72.28,44.45],[-72.23,44.47],[-72.255,44.485],[-72.315,44.505],[-72.705,44.435],[-72.89,44.42],[-73.05,44.49],[-73.2167,44.5167],[-73.15,44.8],[-73.1,45.01],[-73.57,45.45]]},properties:{name:"Royalton Raid — Return with Captives (October 1780)",era:"October 16–November 1780",direction:"South → North: Royalton to Kahnawake (Quebec) via Walden & Lake Champlain",commanders:"Lt. Richard Houghton + ~300 Kahnawake Mohawks",force:"~300 Mohawk warriors + British rangers, with 26 Vermont captives",purpose:"Withdrawal after burning Royalton, Sharon, and Tunbridge; raiders marched captives north to Canada. Route chosen for speed through the Walden corridor to reach the Winooski River.",cahoon_farm_connection:"DIRECT — Houghton's route north from the Winooski watershed passed through Walden. The raiders and their 26 captives traveled along what is now Cahoon Farm Rd as the most direct path between the river valleys and the northern road network.",key_events:"Royalton burned Oct 16 1780 — 2 men killed, 26 captives taken; militia skirmish at Randolph during withdrawal; captives marched through Walden; delivered to British at Kahnawake, Quebec.",stroke:"#E67E22","stroke-width":4,"stroke-opacity":.9}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.23,44.47]},properties:{name:"★ 1186 Cahoon Farm Rd — Walden, VT",description:"Property location. All three paths physically traveled through this location. The Continental Army blockhouse (1779) stood on or immediately adjacent to this land.","marker-color":"#FFD700","marker-size":"large","marker-symbol":"star"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.23,44.47]},properties:{name:"Walden Blockhouse (1779–1781)",description:"Continental Army log blockhouse, 20×40 ft with stone chimney and sharpened abatis. Built 1779 by soldiers under Gen. Moses Hazen. Garrisoned winter 1779–1780. Forward-most American military post in New England during the Revolution. Located on the Bayley-Hazen Military Road on or adjacent to present-day Cahoon Farm Rd.","marker-color":"#C0392B","marker-size":"large","marker-symbol":"fort"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.1469,44.3817]},properties:{name:"Peacham — Soldiers Captured (March 1781)",description:"Two American soldiers were captured by British raiders at a house beside the Bayley-Hazen Road in Peacham, ~10 miles south of Cahoon Farm Rd. Raiders traveled the road through Walden on both approach and withdrawal.","marker-color":"#7D3C98","marker-size":"medium","marker-symbol":"danger"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2954,44.5453]},properties:{name:"Greensboro — Bliss & Sleeper Killed (Sept 1781)",description:"American scouts Constant Bliss and Moses Sleeper were ambushed and killed by British raiders near Caspian Lake, ~7 miles north of Cahoon Farm Rd on the Bayley-Hazen Road. Two others were captured.","marker-color":"#7D3C98","marker-size":"medium","marker-symbol":"danger"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.5317,43.8217]},properties:{name:"South Royalton — Burned Oct 16, 1780",description:"Primary target of Houghton's raid. Homes and farms burned; 2 men killed; 26 captives taken. Raiders withdrew north through Walden on Cahoon Farm Rd corridor.","marker-color":"#E67E22","marker-size":"medium","marker-symbol":"fire-station"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.6117,44.8317]},properties:{name:"Hazen's Notch — Road Terminus (1779)",description:"Northern end of the Bayley-Hazen Military Road. Construction halted here in 1779 when plans for the Canadian invasion were abandoned. British raiders entered Vermont through this pass from 1780 onward, heading south through Walden toward their targets.","marker-color":"#C0392B","marker-size":"medium","marker-symbol":"marker"}}]},{type:"FeatureCollection",name:"Historical Artifacts — 19mi Radius of Cahoon Farm Rd, Walden VT",features:[{type:"Feature",geometry:{type:"Point",coordinates:[-72.23,44.47]},properties:{name:"Walden Blockhouse Site",category:"Military Structure",artifact_type:"Log blockhouse / fortification earthworks",date_created:"Summer 1779",date_used:"1779–1781",distance_miles:0,description:"20×40 ft log blockhouse with stone chimney in the center. Outer beams ran 6 ft beyond walls and were covered with hewed timbers. Port holes cut into upper section. Sharpened abatis of tree tops 8–10 ft high surrounded the structure. Trees felled for 'some distance' in all directions to provide clear field of fire. Garrisoned by Continental Army soldiers winter 1779–1780. First settled dwelling in Walden. Site located on/adjacent to Cahoon Farm Rd. The commanding officer, Lt. Walden, gave the town its name.",status:"Site identified; structure demolished, earthwork depressions likely remain",source:"Jonathan Elkins Reminiscences, VHS Collections v.III (1943); Walden Town History (1986)","marker-color":"#C0392B","marker-size":"large","marker-symbol":"ruin"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.305,44.425]},properties:{name:"Fortification Hill Blockhouse Site — Cabot Plains",category:"Military Structure",artifact_type:"Log blockhouse / fortification with granite commemorative marker",date_created:"Spring 1779",date_used:"1779–1781",distance_miles:5.8,description:"First blockhouse built on the Bayley-Hazen Road north of Peacham. Located on Cabot Plains. A granite marker engraved 'Gen. Hazen Camp' was placed at the site. Iron wagon-wheel ruts from Revolutionary War era iron-wheeled wagons are still visible on ledge outcroppings at the site. Shelf-like indentations from the original road bed remain visible on hillside.",status:"Granite marker present; road ruts and earthwork indentations visible",source:"Cabot Historical Society; North Star Monthly (2024); Bolton family oral history","marker-color":"#C0392B","marker-size":"medium","marker-symbol":"ruin"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2954,44.5453]},properties:{name:"Greensboro / Caspian Lake Blockhouse Site",category:"Military Structure",artifact_type:"Log blockhouse remains + granite memorial monument",date_created:"Summer 1779",date_used:"1779–1781",distance_miles:7.5,description:"Third blockhouse on the Bayley-Hazen Road, near the southwest corner of Caspian Lake. In September 1781, four American scouts manning the blockhouse were surprised by a British-allied raiding party. Two scouts — Constant Bliss and Moses Sleeper — were killed. Two others were taken captive to Quebec. A granite memorial stone was erected at the site approximately 160 years later (c. 1941). The site is known today as 'Block House Hill.' A roadside marker is visible along the Bayley-Hazen Road in Greensboro.",status:"Granite memorial marker present; roadside historical plaque present",source:"Wikipedia: Bayley-Hazen Military Road; VTDigger (Aug 2023); North Star Monthly","marker-color":"#C0392B","marker-size":"medium","marker-symbol":"ruin"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.1469,44.3817]},properties:{name:"Peacham Blockhouse Site",category:"Military Structure",artifact_type:"Log blockhouse earthworks",date_created:"1776 (road construction halted here)",date_used:"1776; 1779–1782",distance_miles:10.2,description:"First blockhouse site on the Bayley-Hazen Military Road, at the farthest point of 1776 construction. In March 1781, two American soldiers — Thomas Johnson, Jonathan Elkins Jr., and Jacob Page — were captured here by British Captain Azariah Pritchard and a party of Canadians and Iroquois while Johnson was building a grist mill. The party stopped overnight on Cabot Plains (near Walden) during the withdrawal north. Site on or near modern Peacham village.",status:"Site historically identified; no standing structure",source:"Cabot Historical Society; Bayley-Hazen Road records","marker-color":"#C0392B","marker-size":"medium","marker-symbol":"ruin"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.22,44.465]},properties:{name:"Bayley-Hazen Road Corduroy Section — Walden",category:"Road Remnant",artifact_type:"Corduroy road (log-laid road surface), road bed depression",date_created:"1779",date_used:"1779–c.1800s",distance_miles:.5,description:"Isolated section of original corduroy road construction on the Bayley-Hazen Military Road in Walden. Corduroy roads were built by laying logs side-by-side across wet or swampy ground, then covering with dirt. Archaeologists have confirmed isolated sections of corduroy road construction survive along the route. The Walden section (nearly 5 miles of the original road) runs through the western side of town; the road bed depression is described as 'well designated' and follows a ridgeline with views west toward Lake Champlain. Approximate location based on Maurice Eddy's 1959 survey.",status:"Partially preserved; road bed depressions confirmed; corduroy sections reported",source:"Maurice Eddy, Walden Town History (1959/1986); Wikipedia: Bayley-Hazen Road","marker-color":"#7D6608","marker-size":"large","marker-symbol":"ruin"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.29,44.42]},properties:{name:"Bayley-Hazen Road Corduroy Section — Cabot Plains",category:"Road Remnant",artifact_type:"Corduroy road surface, wagon ruts on ledge rock",date_created:"1776",date_used:"1776–c.1810s",distance_miles:5.5,description:"On Cabot Plains, the original 1776 road bed is documented by iron wagon-wheel ruts cut into ledge outcroppings. A Bolton family member documented these ruts personally and led guided tours along this section. Shelf-like indentations from the original road are visible on the hillside in the night pasture at the farm. Red-paint trail blazes on trees marked the route for decades. The road ran 'straight' across the plain while a later (post-1790) settler road was built slightly west on a leveler ridge.",status:"Wheel ruts in ledge confirmed; road indentations visible",source:"North Star Monthly, 'Gone But Not Forgotten' (2024); Bolton family oral history","marker-color":"#7D6608","marker-size":"medium","marker-symbol":"ruin"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.24,44.482]},properties:{name:"Bayley-Hazen Road Remnant — Walden Heights to South Walden",category:"Road Remnant",artifact_type:"Original military road bed, swamp crossings, cellar holes",date_created:"1779",date_used:"1779–c.1800s",distance_miles:1.2,description:"The best-preserved section of the Bayley-Hazen Road in Walden, documented in detail by local historian Maurice Eddy (1959). The road enters Walden from the Cabot–Walden Heights road, runs northerly along a ridge with views west, passes a catail swamp on the right, crosses a valley road, and continues over a knoll. An old cellar hole is visible along the route — likely from the first civilian occupation of the blockhouse site after the war. The Walden section crosses two swampy bogs before ascending a steep hillside. Eddy spent years researching, clearing, and marking this section.",status:"Route mapped; cellar holes present; road depressions confirmed",source:"Maurice Eddy booklet (1959); Bayley-Hazen Road website; Walden Town History (1986)","marker-color":"#7D6608","marker-size":"large","marker-symbol":"ruin"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.31,44.418]},properties:{name:"Yellow House Tavern Cellar Hole — Cabot Plains",category:"Road Remnant / Civilian Structure",artifact_type:"Cellar hole, iron artifacts (hinges, keys) — in Cabot Historical Society collection",date_created:"c. 1790–1800s",date_used:"c.1800–mid 1800s",distance_miles:6.1,description:"The Yellow House Tavern (also called the Smugglers' House) stood on Cabot Plains along the post-Revolutionary civilian version of the Bayley-Hazen Road. For about 30 years this was the town business center. The cellar hole survives. Iron hinges and iron keys from the Yellow House are preserved in the Cabot Historical Society collection. An authentication letter for Gen. Hazen's camp kettle is also in the collection, associated with this site area.",status:"Cellar hole present; iron artifacts at Cabot Historical Society",source:"North Star Monthly, 'Gone But Not Forgotten' (2024); Cabot Historical Society","marker-color":"#7D6608","marker-size":"medium","marker-symbol":"ruin"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2954,44.5453]},properties:{name:"Bliss & Sleeper Memorial Stone — Greensboro",category:"Commemorative Monument",artifact_type:"Granite memorial stone",date_created:"c. 1941 (approximately 160 years after the event)",date_used:"Permanent — present",distance_miles:7.5,description:"Granite memorial stone erected near the site of the Greensboro blockhouse to commemorate the killing of American scouts Constant Bliss and Moses Sleeper by a British-allied raiding party in September 1781. Two other scouts were taken captive to Quebec (later exchanged). The stone is visible along the Bayley-Hazen Road in Greensboro. A roadside historical marker also notes the event.",status:"Present and accessible",source:"Wikipedia: Bayley-Hazen Road; VTDigger (Aug 2023); North Star Monthly","marker-color":"#1A5276","marker-size":"medium","marker-symbol":"monument"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.305,44.425]},properties:{name:"Gen. Hazen Camp Granite Marker — Fortification Hill, Cabot",category:"Commemorative Monument",artifact_type:"Granite block engraved marker",date_created:"Date unknown (20th century)",date_used:"Permanent — present",distance_miles:5.8,description:"Granite block at the Fortification Hill site on Cabot Plains engraved with the text 'Gen. Hazen Camp.' Marks the location of the first blockhouse constructed on the Bayley-Hazen Road north of Peacham in 1779. A Continental Army camp was established here during road construction through the summer of 1779.",status:"Present and accessible",source:"Cabot Historical Society; North Star Monthly","marker-color":"#1A5276","marker-size":"medium","marker-symbol":"monument"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.255,44.448]},properties:{name:"Gen. Gordon Shooting Marker — Cabot/Walden Town Line",category:"Commemorative Monument",artifact_type:"Roadside commemorative marker",date_created:"Unknown",date_used:"Permanent — present",distance_miles:3.2,description:"A roadside marker near the Cabot/Walden town line commemorates the shooting of British General Gordon during the Revolutionary War period. The marker is encountered when following the Bayley-Hazen Road from Walden back toward Cabot. Described in Maurice Eddy's 1959 walking guide: 'a marker that commemorates the shooting of General Gordon... in the town of Cabot near the town line.'",status:"Present; condition uncertain",source:"Maurice Eddy booklet (1959); Bayley-Hazen Road walking guide","marker-color":"#1A5276","marker-size":"medium","marker-symbol":"monument"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.0993,44.2281]},properties:{name:"Newbury Monument — Gen. Jacob Bayley Commemoration",category:"Commemorative Monument",artifact_type:"Stone monument",date_created:"20th century",date_used:"Permanent — present",distance_miles:18.5,description:"Monument in Newbury, VT commemorating Col. Jacob Bayley and the construction of the Bayley-Hazen Military Road. Bayley led the original 1776 road construction with 110 men paid $10/month plus board and half a pint of rum daily. Bayley was never repaid the £732 he spent on the road's construction. The road originated in Newbury at the Connecticut River.",status:"Present",source:"Cabot Historical Society; VTDigger (Aug 2023)","marker-color":"#1A5276","marker-size":"medium","marker-symbol":"monument"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.6117,44.8317]},properties:{name:"Bayley-Hazen Road Historical Plaque — Route 58, Westfield",category:"Commemorative Monument",artifact_type:"State historic site plaque",date_created:"Modern",date_used:"Permanent — present",distance_miles:18.8,description:"Vermont state historic site plaque at Hazen's Notch, Route 58, Westfield — the northern terminus of the Bayley-Hazen Military Road. Marks the point where Gen. Hazen halted road construction in late summer 1779, approximately 40 miles short of the intended destination at St. John's, Quebec. The soldiers then returned south to winter at the Walden blockhouse.",status:"Present and accessible — state historic site",source:"Happy Vermont; North Star Monthly; VTDigger","marker-color":"#1A5276","marker-size":"medium","marker-symbol":"monument"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.5017,44.195]},properties:{name:"Vermont Archaeology Heritage Center — Barre",category:"Artifact Collection / Repository",artifact_type:"750+ site collection: projectile points, lithic scatters, colonial ceramics, iron implements, military-era artifacts",date_created:"Founded 2006; artifacts span 13,000 years",date_used:"Open Tue/Thu 9am–4pm or by appointment",distance_miles:14.2,description:"The Vermont Archaeology Heritage Center (VAHC) in Barre serves as the central repository for artifacts and archives from Vermont's archaeological past, with collections from 750+ known sites spanning 13,000 years. Holds artifacts from sites directly related to the Walden/Cahoon Farm Rd corridor including: quartzite flakes, projectile points (Otter Creek-type, side-notched), lithic unifaces, bifaces, fire-cracked rocks, colonial-era ceramics (creamware c.1772–1820, Jackfield ware c.1740–), iron implements, and military-era artifacts. Contact: State Archaeologist Jess Robinson — jess.robinson@vermont.gov / (802) 479-1928. Located in historic Spaulding Graded School, adjacent to Vermont History Center.",status:"Open to public; research appointments available",source:"Vermont Division for Historic Preservation; Vermont Historical Society","marker-color":"#1E8449","marker-size":"medium","marker-symbol":"museum"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.3,44.405]},properties:{name:"Cabot Historical Society — Iron Artifacts from Yellow House / Hazen Camp",category:"Artifact Collection",artifact_type:"Iron hinges, iron keys, Gen. Hazen kettle authentication letter",date_created:"c. 1779–1800s",date_used:"In collection",distance_miles:7,description:"The Cabot Historical Society holds iron hinges and iron keys recovered from the Yellow House Tavern site on Cabot Plains, the post-Revolutionary civilian settlement that grew directly out of the military road and blockhouse network. The collection also includes an authentication letter for Gen. Moses Hazen's camp kettle, directly linking the artifact to the 1779 construction of the Bayley-Hazen Road and the Walden/Cabot blockhouse garrisons.",status:"In collection at Cabot Historical Society",source:"North Star Monthly, 'Gone But Not Forgotten' (2024)","marker-color":"#1E8449","marker-size":"medium","marker-symbol":"museum"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.26,44.485]},properties:{name:"Abenaki Trail Junction — Joe's Pond / Walden Area",category:"Precontact / Native American",artifact_type:"Historic Native American trail corridor; associated lithic scatter (general area)",date_created:"Precontact through c.1780",date_used:"Centuries of use; Joseph Sussap ('Indian Joe') documented 1776",distance_miles:2.1,description:"The Bayley-Hazen Road was deliberately plotted to follow existing Abenaki and Mi'kmaq hunting trails. Joseph Sussap ('Indian Joe'), a Mi'kmaq man raised by an Abenaki family in Odanak, Quebec, served as the primary scout and route-finder for the 1776 road construction. He led Thomas Johnson and four men along these trails from Newbury to Lake Champlain in 11 days on snowshoes (March 1776). Joe's Pond in Cabot/West Danville is named for Indian Joe's son, attesting to Abenaki use of this corridor for generations. The VAI documents lithic scatters and precontact sites along Vermont river corridors; the Winooski and its tributaries near Walden are known Abenaki travel routes.",status:"Trail corridor identified; specific lithic sites protected under VT statute 22 V.S.A. § 761",source:"Cabot Historical Society; VTDigger (2023); VAI (restricted access)","marker-color":"#8E44AD","marker-size":"medium","marker-symbol":"circle"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.21,44.47]},properties:{name:"Grey Lock's Crossing — Walden Highland Corridor",category:"Precontact / Native American",artifact_type:"Known Abenaki raiding and travel route; no fixed artifact site",date_created:"Pre-contact through 1745",date_used:"1722–1745 documented raids",distance_miles:.8,description:"Abenaki war chief Grey Lock (Wôbanakiak) repeatedly crossed the central Vermont highlands between Lake Champlain and the Connecticut River on raiding expeditions during Dummer's War (1722–1725) and afterward. In 1725, a colonial expedition from Northfield traveled up the Connecticut to the Wells River, then up the Winooski River, climbing what was possibly Camel's Hump and seeing Lake Champlain below — following this exact corridor in search of Grey Lock's base. The Walden highland terrain was the primary crossing point for east-west travel across Vermont's spine.",status:"Travel corridor documented; no fixed excavated site",source:"Vermont historical records; Grey Lock's War documentation","marker-color":"#8E44AD","marker-size":"large","marker-symbol":"circle"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.575,44.26]},properties:{name:"Winooski River Precontact Site Corridor — Montpelier Area",category:"Precontact / Native American",artifact_type:"Lithic scatter, projectile points (Otter Creek-type), fire hearths — VAI documented",date_created:"c. 4,000–8,000 years BP",date_used:"Archaic through Woodland periods",distance_miles:16.5,description:"The Winooski River valley is one of Vermont's most archaeologically significant Native American corridors. VAI-documented sites in this area include lithic scatters with quartzite and chert projectile points, Otter Creek-type side-notched points (Vergennes phase, c. 5,000–6,000 BP), fire hearths, and camping sites. The Royalton raiders used this river as their primary travel corridor in October 1780. VAHC collections include artifacts from VELCO pipeline surveys in this area. Exact site locations protected under 22 V.S.A. § 761.",status:"Multiple VAI-registered sites; locations restricted",source:"VAHC Collections Database (2015); Powerful History (VELCO/VDHP handbook)","marker-color":"#8E44AD","marker-size":"medium","marker-symbol":"circle"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.195,44.44]},properties:{name:"Lyford Pond — Named for Hazen's Soldier",category:"Named Feature / Colonial",artifact_type:"Geographic feature named for documented individual",date_created:"1779",date_used:"Permanent",distance_miles:3.5,description:"Lyford Pond in southern Walden was named for Lt. Lyford, a soldier in Gen. Moses Hazen's army during the 1779 road construction. The naming demonstrates the direct presence of Hazen's regiment in this exact area of Walden. The pond likely served as a water source for soldiers building the road and garrisoning the nearby Walden blockhouse.",status:"Geographic feature; name preserved on maps",source:"North Star Monthly (Walden profile, 2016); Walden Town History (1986)","marker-color":"#D35400","marker-size":"medium","marker-symbol":"circle"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.245,44.495]},properties:{name:"Cole's Pond — Named for Revolutionary-Era Explorer",category:"Named Feature / Colonial",artifact_type:"Geographic feature named for documented individual",date_created:"c. 1776–1790",date_used:"Permanent",distance_miles:2.8,description:"Cole's Pond in northern Walden was named for a hunter named Cole from St. Johnsbury who discovered the pond while exploring wilderness territory during the Revolutionary War era. Joe's Brook flows from Cole's Pond south into Joe's Pond in Cabot and West Danville. These named features create a documented chain of individuals who traversed the Walden wilderness during and after the war period.",status:"Geographic feature; name preserved on maps",source:"North Star Monthly (Walden profile, 2016)","marker-color":"#D35400","marker-size":"medium","marker-symbol":"circle"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.155,44.39]},properties:{name:"Elkins Place — Peacham (1776 Road Construction Start Point)",category:"Colonial / Military",artifact_type:"Documented historical site; probable cellar hole",date_created:"1776",date_used:"1776–1780s",distance_miles:11,description:"The home of Deacon Jonathan Elkins in Peacham served as the staging point for the 1776 Bayley-Hazen Road construction. Bayley's men began their 1776 road work from 'Jonathan Elkins' place in what is now Peacham.' Elkins Jr. was later captured here in March 1781 when Thomas Johnson was taken by British raiders. The site represents the southernmost known military encampment on the road corridor, approximately 11 miles south of Cahoon Farm Rd.",status:"Site identified in historical records; probable cellar hole",source:"Cabot Historical Society; VT history records","marker-color":"#D35400","marker-size":"medium","marker-symbol":"circle"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.23,44.47]},properties:{name:"★ 1186 Cahoon Farm Rd — Walden, VT (Property)",category:"Reference Point",artifact_type:"Property center point",date_created:"N/A",date_used:"N/A",distance_miles:0,description:"Center reference point for the 19-mile artifact search radius. All artifacts in this dataset are within 19 miles of this location. This property sits on or immediately adjacent to the Bayley-Hazen Military Road (1779) and the site of the Walden blockhouse.",status:"Reference point only",source:"User-provided","marker-color":"#FFD700","marker-size":"large","marker-symbol":"star"}}]},{type:"FeatureCollection",name:"1858-1859 Walling Map of Walden Vermont — Felt Upload",features:[{type:"Feature",geometry:{type:"Polygon",coordinates:[[[-72.175,44.415],[-72.175,44.42],[-72.17,44.44],[-72.175,44.46],[-72.18,44.48],[-72.185,44.5],[-72.2,44.52],[-72.215,44.53],[-72.24,44.535],[-72.265,44.535],[-72.29,44.525],[-72.305,44.51],[-72.31,44.49],[-72.305,44.47],[-72.3,44.45],[-72.295,44.43],[-72.285,44.415],[-72.27,44.408],[-72.25,44.405],[-72.23,44.408],[-72.21,44.412],[-72.195,44.415],[-72.175,44.415]]]},properties:{name:"Walden Town Boundary (1858 Walling Map)",category:"Town Boundary",map_date:"1858–1859",description:"Town of Walden, Caledonia County, Vermont as surveyed for the 1858 Walling map. Area ~39 sq. miles. Population 910 (reported on 1858 map). Bounded by Greensboro (N), Stannard (NE), Danville (E), Cabot (S/SW), Hardwick (W). 168 named landowners documented.",source:"H.F. Walling, Map of Caledonia County VT, 1858",fill:"#F5DEB3","fill-opacity":.12,stroke:"#8B4513","stroke-width":2,"stroke-opacity":.7}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.248,44.474]},properties:{name:"Noyesville (East Walden) — Post Village",category:"Village Center",map_date:"1858",description:"Eastern Walden post village, the commercial hub of mid-19th-century Walden. Documented on 1858 Walling map with: 1 store, sawmill, blacksmith shop, feather duster shop, lumber dressing & grist mill, potato starch factory, several dwellings, and the Methodist Church (built 1856). Also had its own school. Named for the Noyes family, early settlers.","marker-color":"#B7410E","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859",map_features:"Store, sawmill, gristmill, blacksmith, Methodist Church, school, starch factory"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.247,44.47]},properties:{name:"Walden Four Corners — Post Village",category:"Village Center",map_date:"1858",description:"Geographic center of Walden and post village on the 1858 map. Located at the junction of the County Road toward North Walden and the main east-west road. Had: 1 store, mill, school, and several dwellings. The 'Four Corners' designation appears on the Walling map as a named settlement.","marker-color":"#B7410E","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859",map_features:"Store, mill, school, dwellings, county road junction"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.245,44.505]},properties:{name:"North Walden — Hamlet",category:"Village Center",map_date:"1858",description:"Northern Walden hamlet shown on 1858 Walling map. Had the Congregational Church (organized 1805, documented on map) and a school. Near Cole's Pond. Less developed than Noyesville but an important religious center for north Walden families.","marker-color":"#B7410E","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859",map_features:"Congregational Church, school, dwellings"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.235,44.435]},properties:{name:"South Walden — Hamlet (Taylorville / Houston Hill)",category:"Village Center",map_date:"1858",description:"Southwestern Walden hamlet on the 1858 Walling map, including the sub-areas of Taylorville and Houston Hill. The Bayley-Hazen Road ran through South Walden. Had: old stagecoach inn at the crossroads, school, store, creamery, blacksmith shop, and several dwellings. Also had a church (first fire company).","marker-color":"#B7410E","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859",map_features:"Stagecoach inn, school, store, creamery, blacksmith, church, Bayley-Hazen Road"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.22,44.48]},properties:{name:"Walden Heights — Hamlet",category:"Village Center",map_date:"1858",description:"Elevated hamlet in central-east Walden shown on 1858 map. Located on the high terrain of the Bayley-Hazen Road corridor. Had a school and several farm dwellings. The Walden Heights Cemetery was established here. Elevation approximately 1,600–1,700 ft.","marker-color":"#B7410E","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859",map_features:"School, dwellings, cemetery, high-elevation farms"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.247,44.475]},properties:{name:"Sawmill — Noyesville",category:"Mill",map_date:"1858",description:"Sawmill at Noyesville documented on the 1858 Walling map. Powered by Joe's Brook or a tributary. Served Walden's lumber needs in the mid-19th century when the town's forests were being cleared for farms. Sawmills were among the first industrial structures in new Vermont towns.","marker-color":"#1E8449","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2465,44.4745]},properties:{name:"Grist Mill / Lumber Dressing Mill — Noyesville",category:"Mill",map_date:"1858",description:"Combined grist and lumber dressing mill at Noyesville, documented on 1858 map. Ground grain for local farmers. Lumber dressing mills finished rough-cut lumber into boards for construction. This mill complex was the economic engine of mid-19th century Walden.","marker-color":"#1E8449","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.246,44.474]},properties:{name:"Potato Starch Factory — Noyesville",category:"Mill",map_date:"1858",description:"Potato starch manufacturing facility at Noyesville, one of the most unusual industries documented on the 1858 Walling map. Walden's highland soils were suited to potato cultivation. Starch was used industrially in textile sizing, papermaking, and food production. This factory connected Walden to regional commercial markets via the county road system.","marker-color":"#1E8449","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2455,44.47]},properties:{name:"Mill — Walden Four Corners",category:"Mill",map_date:"1858",description:"Mill at Walden Four Corners documented on the 1858 Walling map. Type uncertain (likely sawmill or gristmill). Located at the county road junction in the geographic center of town, accessible from all villages.","marker-color":"#1E8449","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.249,44.476]},properties:{name:"Methodist Church — Noyesville (built 1856)",category:"Church",map_date:"1856 (shown on 1858 map)",description:"Methodist Church at Noyesville, built 1856 and appearing on the 1858 Walling map. One of two churches documented in Walden on the map. Methodist congregations were common in Vermont's rural highlands. This was the newest church in Walden at the time of the survey.","marker-color":"#8E44AD","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.245,44.5055]},properties:{name:"Congregational Church — North Walden (organized 1805)",category:"Church",map_date:"Organized 1805; shown on 1858 map",description:"Congregational Church at North Walden, organized 1805 — the first church organization in Walden. Deacon Theophilus Rundlet conducted religious meetings here for many years. The church was the social and spiritual center of northern Walden. Still documented on the 1858 Walling map, 53 years after its founding.","marker-color":"#8E44AD","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.236,44.4355]},properties:{name:"Church — South Walden",category:"Church",map_date:"1858",description:"Church in South Walden documented on the 1858 Walling map. Denomination not confirmed in available records. Located at the South Walden crossroads near the stagecoach inn. Also served as the location of Walden's first fire company.","marker-color":"#8E44AD","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.248,44.4755]},properties:{name:"School District — Noyesville",category:"School",map_date:"1858",description:"School at Noyesville documented on the 1858 Walling map. Vermont's 1827 Common School Act required each town to maintain district schools. By 1858 Walden had multiple one-room schoolhouses serving its scattered population of 910.","marker-color":"#2E86C1","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2455,44.4705]},properties:{name:"School District — Walden Four Corners",category:"School",map_date:"1858",description:"School at Walden Four Corners documented on the 1858 Walling map. Served children from the central Walden area including farms along the County Road and Cahoon Farm Road corridor.","marker-color":"#2E86C1","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2445,44.5052]},properties:{name:"School District — North Walden",category:"School",map_date:"1858",description:"School at North Walden documented on the 1858 Walling map. Adjacent to the Congregational Church, forming the social and educational center of the northern part of town.","marker-color":"#2E86C1","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2355,44.436]},properties:{name:"School District — South Walden",category:"School",map_date:"1858",description:"School at South Walden documented on the 1858 Walling map. Located near the crossroads and stagecoach inn in Taylorville/South Walden.","marker-color":"#2E86C1","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.221,44.4805]},properties:{name:"School District — Walden Heights",category:"School",map_date:"1858",description:"School at Walden Heights documented on the 1858 Walling map. Served families on the high terrain of the Bayley-Hazen Road corridor. Elevated location meant severe winters and difficult travel to school.","marker-color":"#2E86C1","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2475,44.475]},properties:{name:"Store — Noyesville",category:"Commercial",map_date:"1858",description:"General store at Noyesville, the commercial hub of Walden in 1858. Stocked provisions, dry goods, and hardware for the surrounding farm community. Noyesville was the post village — the store likely doubled as the post office.","marker-color":"#E67E22","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.246,44.4703]},properties:{name:"Store — Walden Four Corners",category:"Commercial",map_date:"1858",description:"General store at Walden Four Corners documented on the 1858 Walling map. Served the central crossroads area. By 1859 Walden had a declining commercial base as nearby Hardwick and Danville drew trade.","marker-color":"#E67E22","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2355,44.4353]},properties:{name:"Stagecoach Inn — South Walden crossroads",category:"Commercial",map_date:"1858",description:"Old stagecoach inn at the South Walden crossroads, documented on 1858 map. Located on the county road system at a crossroads point. Served travelers on the route between Cabot and Walden. By 1858 the stagecoach era was fading as railroads grew, but this inn still operated.","marker-color":"#E67E22","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2358,44.4358]},properties:{name:"Blacksmith Shop — South Walden",category:"Commercial",map_date:"1858",description:"Blacksmith shop at South Walden documented on the 1858 Walling map. Essential rural service: horseshoeing, wagon ironwork, farm tool repair. South Walden also had a creamery nearby, reflecting the dairy economy that was beginning to dominate Vermont agriculture by the 1850s.","marker-color":"#E67E22","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.248,44.4748]},properties:{name:"Blacksmith Shop — Noyesville",category:"Commercial",map_date:"1858",description:"Blacksmith shop at Noyesville, documented on 1858 Walling map. Noyesville's blacksmith served the eastern part of Walden. The feather duster shop at Noyesville (also on the map) was an unusual cottage industry for a Vermont highland town.","marker-color":"#E67E22","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2478,44.4746]},properties:{name:"Feather Duster Shop — Noyesville",category:"Commercial",map_date:"1858",description:"Feather duster manufacturing shop at Noyesville, documented on the 1858 map. A rare and specialized industry for a small Vermont highland town. Turkey and goose feathers from local farms were processed and assembled into cleaning dusters for sale in regional markets. One of the more unusual entries on the Walling map for Walden.","marker-color":"#E67E22","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.236,44.435]},properties:{name:"Creamery — South Walden",category:"Commercial",map_date:"1858",description:"Creamery at South Walden documented on the 1858 Walling map. By the 1850s Vermont was rapidly transitioning from mixed farming to dairy specialization. This creamery processed milk from surrounding farms into butter and cheese for regional markets. One of the earliest dairy processing facilities documented in Walden.","marker-color":"#E67E22","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.247,44.47]},properties:{name:"Cahoon Family Farm — Farm (1858 Walling Map)",category:"Farmstead / Landowner",map_date:"1858",description:"Landowner documented on the 1858 H.F. Walling map of Caledonia County, Vermont. Location: Central Walden — Cahoon Farm Rd namesake family. One of 168 named landowners recorded in Walden township on the map. Population of Walden in 1858: 910. The map recorded the name of the owner beside the symbol for their house on the survey sheet.","marker-color":"#FFD700","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859",map_note:"Central Walden — Cahoon Farm Rd namesake family"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.232,44.471]},properties:{name:"Eddy, Capt. Maurice — Farm (1858 Walling Map)",category:"Farmstead / Landowner",map_date:"1858",description:"Landowner documented on the 1858 H.F. Walling map of Caledonia County, Vermont. Location: South-central Walden — first carriage maker; died Dec 25, 1859. One of 168 named landowners recorded in Walden township on the map. Population of Walden in 1858: 910. The map recorded the name of the owner beside the symbol for their house on the survey sheet.","marker-color":"#C0392B","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859",map_note:"South-central Walden — first carriage maker; died Dec 25, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.241,44.452]},properties:{name:"Gilman, David — Farm (1858 Walling Map)",category:"Farmstead / Landowner",map_date:"1858",description:"Landowner documented on the 1858 H.F. Walling map of Caledonia County, Vermont. Location: South Walden — early settler; surveyor of highways 1797. One of 168 named landowners recorded in Walden township on the map. Population of Walden in 1858: 910. The map recorded the name of the owner beside the symbol for their house on the survey sheet.","marker-color":"#C0392B","marker-size":"small"
