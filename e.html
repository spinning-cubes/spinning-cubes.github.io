 Documented on the 1858 Walling map. Located in northern Walden. Joe's Brook flows from Cole's Pond south into Joe's Pond in Cabot and West Danville. Cole's discovery links this natural feature to the same era as the blockhouse.","marker-color":"#117A65","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.225,44.46]},properties:{name:"Joe's Brook",category:"Natural Feature",map_date:"1858",description:"Primary drainage of Walden, documented on the 1858 Walling map. Flows from Cole's Pond south through central Walden to Joe's Pond in Cabot/West Danville. Named for Joseph Sussap's son ('Indian Joe's son') — Joseph Sussap was the Mi'kmaq scout who guided the 1776 Bayley-Hazen Road survey expedition. This waterway thus carries the name of the man who made the military road possible.","marker-color":"#117A65","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.24,44.535]},properties:{name:"Stannard Mountain (summit near north border)",category:"Natural Feature",map_date:"1858",description:"Highest point in Walden at 2,579 ft, documented as a terrain feature on the 1858 Walling map. Located near the northern border with Stannard township. The summit's elevation made Walden one of the highest-elevation towns in Caledonia County, contributing to its reputation for severe winters and heavy snow — 'nine months of winter and three months of late fall.'","marker-color":"#117A65","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.23,44.468]},properties:{name:"Steam Mill Brook",category:"Natural Feature",map_date:"1858",description:"Brook documented on the 1858 Walling map draining part of central Walden. The Steam Mill Brook Wildlife Management Area (10,826 acres, state-owned) is named for this waterway. Powered at least one mill in the 1858 era.","marker-color":"#117A65","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"LineString",coordinates:[[-72.147,44.381],[-72.182,44.411],[-72.205,44.435],[-72.215,44.445],[-72.23,44.47],[-72.247,44.47],[-72.255,44.485],[-72.295,44.545]]},properties:{name:"Bayley-Hazen Military Road / County Road (shown on 1858 map)",category:"Road / Route",road_type:"Military road / County road",map_date:"1858–1859",description:"The Bayley-Hazen Military Road of 1779 was still in use as the primary county road through Walden in 1858 — documented as a main road on the Walling map. By 1858 it was called the 'County Road' and was the principal north-south route through Walden from Peacham (south) through South Walden, the Four Corners, Walden Heights, and toward Greensboro (north). Cahoon Farm Road is a portion of this historical corridor.",source:"H.F. Walling, Map of Caledonia County VT, 1858",stroke:"#8B4513","stroke-width":2,"stroke-opacity":.85}},{type:"Feature",geometry:{type:"LineString",coordinates:[[-72.315,44.505],[-72.295,44.505],[-72.27,44.497],[-72.248,44.473],[-72.233,44.47],[-72.21,44.471],[-72.195,44.471]]},properties:{name:"East-West Road through Walden (Vermont Route 15 predecessor, 1858 map)",category:"Road / Route",road_type:"Town road / County road",map_date:"1858–1859",description:"Primary east-west road through Walden documented on the 1858 Walling map. Ran from Hardwick (west) through the Four Corners and Noyesville area to Danville (east). This road is the predecessor of modern Vermont Route 15. In 1858 it connected Walden's commercial centers to market towns on both sides.",source:"H.F. Walling, Map of Caledonia County VT, 1858",stroke:"#8B4513","stroke-width":2,"stroke-opacity":.85}},{type:"Feature",geometry:{type:"LineString",coordinates:[[-72.247,44.47],[-72.246,44.485],[-72.245,44.5],[-72.245,44.515],[-72.244,44.525]]},properties:{name:"North Walden Road — County Road toward North Walden (1858 map)",category:"Road / Route",road_type:"Town road",map_date:"1858–1859",description:"Road documented on the 1858 Walling map connecting Walden Four Corners north to the North Walden hamlet, passing the Congregational Church. Named 'the County Road toward North Walden' in historical records.",source:"H.F. Walling, Map of Caledonia County VT, 1858",stroke:"#8B4513","stroke-width":2,"stroke-opacity":.85}},{type:"Feature",geometry:{type:"LineString",coordinates:[[-72.247,44.47],[-72.242,44.458],[-72.238,44.448],[-72.235,44.437],[-72.235,44.425]]},properties:{name:"South Walden Road (1858 map)",category:"Road / Route",road_type:"Town road",map_date:"1858–1859",description:"Road connecting Walden Four Corners south to South Walden / Taylorville, documented on the 1858 Walling map. Passed the South Walden creamery, blacksmith shop, stagecoach inn, and church.",source:"H.F. Walling, Map of Caledonia County VT, 1858",stroke:"#8B4513","stroke-width":2,"stroke-opacity":.85}},{type:"Feature",geometry:{type:"LineString",coordinates:[[-72.247,44.47],[-72.235,44.472],[-72.225,44.476],[-72.215,44.48],[-72.205,44.483]]},properties:{name:"Walden Heights Road (1858 map)",category:"Road / Route",road_type:"Town road",map_date:"1858–1859",description:"Road running east from Walden Four Corners toward Walden Heights, documented on the 1858 Walling map. Served the higher-elevation farms and the Walden Heights school and cemetery. This road followed the ridgeline where the Bayley-Hazen Road blockhouse was situated.",source:"H.F. Walling, Map of Caledonia County VT, 1858",stroke:"#8B4513","stroke-width":2,"stroke-opacity":.85}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.244,44.44]},properties:{name:"South Walden Cemetery (1858 map era)",category:"Cemetery",map_date:"By 1858",description:"South Walden Cemetery — documented in Walden by 1858. Vermont's rural cemeteries were typically established within the first generation of a town's settlement. These burial grounds contain many of the 168 landowners documented on the 1858 Walling map and their families.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.245,44.507]},properties:{name:"North Walden Cemetery (1858 map era)",category:"Cemetery",map_date:"By 1858",description:"North Walden Cemetery — documented in Walden by 1858. Vermont's rural cemeteries were typically established within the first generation of a town's settlement. These burial grounds contain many of the 168 landowners documented on the 1858 Walling map and their families.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.218,44.479]},properties:{name:"Walden Heights Cemetery (1858 map era)",category:"Cemetery",map_date:"By 1858",description:"Walden Heights Cemetery — documented in Walden by 1858. Vermont's rural cemeteries were typically established within the first generation of a town's settlement. These burial grounds contain many of the 168 landowners documented on the 1858 Walling map and their families.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.238,44.465]},properties:{name:"Perkins Cemetery (1858 map era)",category:"Cemetery",map_date:"By 1858",description:"Perkins Cemetery — documented in Walden by 1858. Vermont's rural cemeteries were typically established within the first generation of a town's settlement. These burial grounds contain many of the 168 landowners documented on the 1858 Walling map and their families.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.238,44.46]},properties:{name:"Stevens Hill Cemetery (1858 map era)",category:"Cemetery",map_date:"By 1858",description:"Stevens Hill Cemetery — documented in Walden by 1858. Vermont's rural cemeteries were typically established within the first generation of a town's settlement. These burial grounds contain many of the 168 landowners documented on the 1858 Walling map and their families.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.253,44.461]},properties:{name:"Orton Cemetery (1858 map era)",category:"Cemetery",map_date:"By 1858",description:"Orton Cemetery — documented in Walden by 1858. Vermont's rural cemeteries were typically established within the first generation of a town's settlement. These burial grounds contain many of the 168 landowners documented on the 1858 Walling map and their families.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.265,44.473]},properties:{name:"Noyesville Cemetery (1858 map era)",category:"Cemetery",map_date:"By 1858",description:"Noyesville Cemetery — documented in Walden by 1858. Vermont's rural cemeteries were typically established within the first generation of a town's settlement. These burial grounds contain many of the 168 landowners documented on the 1858 Walling map and their families.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.23,44.47]},properties:{name:"★ 1186 Cahoon Farm Rd — Reference Point (Cahoon Family Farm, 1858)",category:"Reference Point",map_date:"1858",description:"Modern address 1186 Cahoon Farm Rd, Walden VT. The Cahoon family farm is documented in the Walden area on the 1858 Walling map. Cahoon Farm Road itself follows the route of the Bayley-Hazen Military Road (1779) — shown as the main County Road on the 1858 map. Population of Walden in 1858: 910. Total named landowners on the map: 168.","marker-color":"#FFD700","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2,44.415]},properties:{name:"MAP SOURCE — H.F. Walling, 1858/1859",category:"Map Metadata",map_date:"1858",description:"Source: 'Map of Caledonia County, Vermont From Actual Surveys under the direction of H.F. Walling', New York: Baker & Tilden, 1858. Library of Congress: G3753.C2 1858 .W2 (LC Land ownership maps, 1183). The same survey data appears in the companion 1859 map: 'Map of the Counties of Orleans, Lamoille and Essex, Vermont', published by Loomis & Way, New York, 1859 (LC: G3753.O7 1859 .W2). Map features: 168 named landowners in Walden; population 910; all roads, mills, churches, schools, natural features documented. The original 5'x5' wall map is held at the Library of Congress and Vermont Historical Society. Digitized version available at loc.gov.","marker-color":"#2E86C1","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858 / Orleans-Lamoille-Essex map, 1859"}}]},{type:"FeatureCollection",name:"1858 Schools of Walden Vermont — Kittredge Focus — Felt Upload",features:[{type:"Feature",geometry:{type:"Point",coordinates:[-72.248,44.4755]},properties:{name:"School District No. 1 — Noyesville (East Walden)",category:"Confirmed School — 1858 Walling Map",map_year:"1858",description:"One-room schoolhouse at Noyesville, the post village of East Walden. Explicitly documented on the 1858 H.F. Walling map with the school symbol. Noyesville was Walden's most commercial village in 1858, with a store, sawmill, gristmill, blacksmith, Methodist Church (built 1856), and feather duster shop in addition to the school. The school served children of the eastern Walden farm families. KITTREDGE CONNECTION: The Kittridge family (Jerome, 27; Elisabeth, 24; Henry, 6; Luella, 3 — 1850 census, pg.289) lived in eastern Walden nearest Noyesville. Their children would have attended this district school. George S. Kittridge (16) and Elisabeth Kittridge (7) documented in the same area (pg.293) were of school age in 1858.","marker-color":"#2E86C1","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",district_number:"No. 1",village:"Noyesville",kittredge_connection:"YES — Jerome Kittridge household (1850 census pg.289) in this district area",school_type:"One-room district schoolhouse",enrollment_est:"15–25 pupils"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.246,44.4705]},properties:{name:"School District No. 2 — Walden Four Corners (Town Center)",category:"Confirmed School — 1858 Walling Map",map_year:"1858",description:"One-room schoolhouse at Walden Four Corners, the geographic center of town and a post village in 1858. Explicitly documented on the 1858 Walling map. Located at the junction of the County Road (Bayley-Hazen Road corridor) and the main east-west road. The school here served children of the central Walden farms along Cahoon Farm Road and the County Road. KITTREDGE CONNECTION: Lyman O. Kittredge (age 42) and Mary Kittredge (age 44) are documented in Walden on the 1850 census (pg.296, near the center of town). Their farm location near the Four Corners would place their family in this school district. The 1858 Walling map likely shows the Kittredge/Kittridge farm name near this location.","marker-color":"#2E86C1","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",district_number:"No. 2",village:"Walden Four Corners",kittredge_connection:"PROBABLE — Lyman O. Kittredge (1850 census pg.296) farm in this district area",school_type:"One-room district schoolhouse",enrollment_est:"15–25 pupils"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2445,44.5052]},properties:{name:"School District No. 3 — North Walden",category:"Confirmed School — 1858 Walling Map",map_year:"1858",description:"One-room schoolhouse at North Walden hamlet, documented on the 1858 Walling map adjacent to the Congregational Church (organized 1805). The church and school together formed the social center of northern Walden. Served farm families in the Cole's Pond / North Walden area. The Congregational Church at North Walden was founded in 1805 by Deacon Theophilus Rundlet — 'a man of fervent piety' — and still active in 1858.","marker-color":"#2E86C1","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",district_number:"No. 3",village:"North Walden",kittredge_connection:"POSSIBLE — northern Walden families documented in census near this area",school_type:"One-room district schoolhouse (adjacent to Congregational Church)",enrollment_est:"12–20 pupils"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.2355,44.436]},properties:{name:"School District No. 4 — South Walden / Taylorville (Houston Hill)",category:"Confirmed School — 1858 Walling Map",map_year:"1858",description:"One-room schoolhouse at South Walden crossroads (also known as Taylorville and Houston Hill area), documented on the 1858 Walling map. Located at the stagecoach inn crossroads. The Bayley-Hazen Military Road ran directly through South Walden. This district had a church, creamery, blacksmith shop, and store in addition to the school. South Walden Cemetery is nearby. KITTREDGE CONNECTION: Fanny Kittridge (37) and family including John (14), Edwin (9/12), and Louisa (4) are documented on the 1850 census (pg.292) in the southern Walden area — likely in this school district.","marker-color":"#2E86C1","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",district_number:"No. 4",village:"South Walden / Taylorville",kittredge_connection:"PROBABLE — Fanny Kittridge household (1850 census pg.292) in this district area",school_type:"One-room district schoolhouse",enrollment_est:"15–25 pupils"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.221,44.4805]},properties:{name:"School District No. 5 — Walden Heights",category:"Confirmed School — 1858 Walling Map",map_year:"1858",description:"One-room schoolhouse at Walden Heights, documented on the 1858 Walling map. Located on the high-elevation terrain (~1,600–1,700 ft) of the Bayley-Hazen Road corridor in east-central Walden. The Walden Heights Cemetery is adjacent. This was the highest-elevation school in Walden — severe winters meant that the school term was often interrupted by heavy snowfall. An early Walden resident described the town as 'nine months of winter and three months of late fall.' This school had the most challenging attendance conditions of any Walden district.","marker-color":"#2E86C1","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",district_number:"No. 5",village:"Walden Heights",kittredge_connection:"POSSIBLE — farm families on the high terrain corridor attended this school",school_type:"One-room district schoolhouse (highest elevation in Walden)",enrollment_est:"10–18 pupils"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.225,44.462]},properties:{name:"School District No. 6 — Walden Station / Steam Mill Brook Area (probable)",category:"Probable School District — 1858 Era",map_year:"1858",description:"A sixth school district is highly probable for the Walden Station and Steam Mill Brook corridor based on the population distribution shown on the 1858 Walling map. Vermont's Common School Act required a school within reasonable walking distance of all children — in a town of 910 people spread across 39 square miles of hilly terrain, at least 6 districts would have been necessary. The Steam Mill Brook Wildlife Management Area (10,826 acres) preserves the landscape of this district. KITTREDGE CONNECTION: This district area encompasses farms between the Four Corners and Walden Heights — the geographic zone where Kittredge/Kittridge farm properties are most likely to have been located based on the 1850 census page references (pg.289–296).","marker-color":"#2E86C1","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",district_number:"No. 6 (probable)",village:"Walden Station / Steam Mill Brook area",kittredge_connection:"PROBABLE — census pages 289-296 place Kittridge families in this corridor",school_type:"One-room district schoolhouse (probable)",enrollment_est:"10–15 pupils (estimated)"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.245,44.47]},properties:{name:"★ Kittredge, Lyman O. — Farm / Landowner (1858 Walling Map)",category:"Kittredge Family — 1858 Walling Map Landowner",map_year:"1858",description:"LYMAN O. KITTREDGE (also spelled KITTRIDGE on some records), age 42 in 1850, farmer. Documented in Walden on the 1850 U.S. Federal Census, page 296. His wife Mary Kittredge (age 44) documented on the same census page. As a landowner in Walden, Lyman O. Kittredge's name almost certainly appears on the 1858 H.F. Walling map of Caledonia County among the 168 named landowners shown for Walden. SCHOOL DISTRICT: His farm's location near Walden Four Corners (census page sequence places him in the central Walden area) puts his children in School District No. 2 (Four Corners) or No. 6 (Steam Mill Brook). The Kittredge farm was a working 19th-century Vermont hill farm, likely producing dairy, wool, and maple sugar.","marker-color":"#FFD700","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",census_year:"1850 & 1858",census_page:"pg.296 (1850 Walden census)",household_members:"Lyman O. Kittredge (42), Mary Kittredge (44)",school_district:"Probably No. 2 (Four Corners) or No. 6 (Steam Mill Brook)",map_appearance:"Name likely on 1858 Walling map as landowner"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.251,44.477]},properties:{name:"Kittridge, Jerome — Farm (1850 Census, eastern Walden)",category:"Kittredge Family — 1850 Census",map_year:"1858",description:"JEROME KITTRIDGE, age 27 in 1850, documented in Walden on the 1850 U.S. Federal Census, page 289. Household included Elisabeth Kittridge (24) and children Henry (6), Luella (3). By 1858, the children of this household (now ages ~14 and ~11) were in the middle of their district school years. Census page sequence (pg.289) places this household in eastern Walden, near the Noyesville area — School District No. 1. George S. Kittridge (16) and Elisabeth Kittridge (7) documented nearby (pg.293) suggest a closely related family in the same district.","marker-color":"#C0392B","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",census_year:"1850",census_page:"pg.289 (1850 Walden census)",household_members:"Jerome Kittridge (27), Elisabeth (24), Henry (6), Luella (3)",school_district:"Probably No. 1 (Noyesville) — eastern Walden location",note:"By 1858: Henry ~14, Luella ~11 — both school age"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.239,44.442]},properties:{name:"Kittridge, Fanny — Farm (1850 Census, southern Walden)",category:"Kittredge Family — 1850 Census",map_year:"1858",description:"FANNY KITTRIDGE, age 37 in 1850, documented in Walden on the 1850 U.S. Federal Census, page 292. Household included John Kittridge (14), Edwin Kittridge (9 months), and Louisa Kittridge (4). Census page sequence (pg.292) places this household in southern Walden, near South Walden / Taylorville area — School District No. 4. John Kittridge (age 14 in 1850, ~22 in 1858) was of school age in 1850 and would have been a young adult farmer by 1858. This family lived near the Bayley-Hazen Road corridor through South Walden.","marker-color":"#C0392B","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",census_year:"1850",census_page:"pg.292 (1850 Walden census)",household_members:"Fanny Kittridge (37), John (14), Edwin (9mo), Louisa (4)",school_district:"Probably No. 4 (South Walden / Taylorville)",note:"John Kittridge (14 in 1850) was school age — attended South Walden school"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.253,44.475]},properties:{name:"Kittridge, George S. & Elisabeth — Farm (1850 Census, eastern Walden)",category:"Kittredge Family — 1850 Census",map_year:"1858",description:"GEORGE S. KITTRIDGE, age 16 in 1850, and ELISABETH KITTRIDGE, age 7, documented in Walden on the 1850 U.S. Federal Census, page 293. This appears to be a separate household from Jerome's family, likely siblings or cousins in the extended Kittridge family. Page 293 places them in eastern Walden near Noyesville — School District No. 1. George (16 in 1850, ~24 in 1858) was at the upper end of school age in 1850; Elisabeth (7 in 1850, ~15 in 1858) was fully school age in 1858.","marker-color":"#C0392B","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",census_year:"1850",census_page:"pg.293 (1850 Walden census)",household_members:"George S. Kittridge (16), Elisabeth Kittridge (7)",school_district:"Probably No. 1 (Noyesville) — eastern Walden location",note:"Elisabeth Kittridge (7 in 1850, ~15 in 1858) attended Noyesville school"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.246,44.471]},properties:{name:"Kittredge Family — Walden (Charles Henry Kittredge, b. 1884)",category:"Kittredge Family — Continued Presence in Walden",map_year:"1858",description:"CHARLES HENRY KITTREDGE was born February 5, 1884 in Walden, Caledonia County, Vermont, and died September 30, 1947 in Walden. Father: Walter H. Kittredge; Mother: Ella Mariah Davidson. This confirms the Kittredge family remained in Walden for multiple generations after the 1858 map era. The Walter H. Kittredge household would have had children attending Walden district schools in the 1880s–1900s, a generation after the 1858 Walling map. The family's multi-generational Walden presence makes the 1858 Kittredge landowner documentation highly probable.","marker-color":"#C0392B","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",census_year:"Birth record: 1884",note:"Confirms Kittredge family in Walden across multiple generations through 1947"}},{type:"Feature",geometry:{type:"Polygon",coordinates:[[[-72.22,44.455],[-72.22,44.475],[-72.235,44.49],[-72.26,44.49],[-72.275,44.475],[-72.275,44.455],[-72.26,44.445],[-72.235,44.445],[-72.22,44.455]]]},properties:{name:"School District No. 1 — Noyesville Service Area",category:"School District Area",map_year:"1858",description:"Approximate service area for the Noyesville school district, 1858. Covered eastern Walden farms in the Noyesville post village area. Kittridge families (Jerome, George S.) likely attended this school.",fill:"#2E86C1","fill-opacity":.12,stroke:"#2E86C1","stroke-width":1.5,"stroke-opacity":.6,source:"H.F. Walling, Map of Caledonia County VT, 1858"}},{type:"Feature",geometry:{type:"Polygon",coordinates:[[[-72.24,44.455],[-72.225,44.455],[-72.225,44.48],[-72.24,44.485],[-72.26,44.48],[-72.26,44.455],[-72.24,44.455]]]},properties:{name:"School District No. 2 — Walden Four Corners Service Area",category:"School District Area",map_year:"1858",description:"Approximate service area for the Walden Four Corners school district, 1858. Covered central Walden along the County Road (Bayley-Hazen Road / Cahoon Farm Rd). Lyman O. Kittredge farm most likely in this district.",fill:"#1A5276","fill-opacity":.12,stroke:"#1A5276","stroke-width":1.5,"stroke-opacity":.6,source:"H.F. Walling, Map of Caledonia County VT, 1858"}},{type:"Feature",geometry:{type:"Polygon",coordinates:[[[-72.255,44.49],[-72.235,44.49],[-72.23,44.51],[-72.235,44.53],[-72.26,44.53],[-72.27,44.51],[-72.265,44.49],[-72.255,44.49]]]},properties:{name:"School District No. 3 — North Walden Service Area",category:"School District Area",map_year:"1858",description:"Approximate service area for the North Walden school district, 1858. Covered northern Walden farms near Cole's Pond and the Congregational Church.",fill:"#117A65","fill-opacity":.12,stroke:"#117A65","stroke-width":1.5,"stroke-opacity":.6,source:"H.F. Walling, Map of Caledonia County VT, 1858"}},{type:"Feature",geometry:{type:"Polygon",coordinates:[[[-72.25,44.415],[-72.22,44.415],[-72.215,44.445],[-72.225,44.455],[-72.25,44.455],[-72.265,44.445],[-72.26,44.42],[-72.25,44.415]]]},properties:{name:"School District No. 4 — South Walden / Taylorville Service Area",category:"School District Area",map_year:"1858",description:"Approximate service area for the South Walden school district, 1858. Covered southern Walden farms along the Bayley-Hazen Road corridor. Fanny Kittridge household (1850 census pg.292) likely in this district.",fill:"#884EA0","fill-opacity":.12,stroke:"#884EA0","stroke-width":1.5,"stroke-opacity":.6,source:"H.F. Walling, Map of Caledonia County VT, 1858"}},{type:"Feature",geometry:{type:"Polygon",coordinates:[[[-72.2,44.46],[-72.2,44.495],[-72.215,44.505],[-72.235,44.505],[-72.235,44.485],[-72.225,44.455],[-72.21,44.455],[-72.2,44.46]]]},properties:{name:"School District No. 5 — Walden Heights Service Area",category:"School District Area",map_year:"1858",description:"Approximate service area for the Walden Heights school district, 1858. Covered high-elevation farms (~1,600–1,700 ft) along the Bayley-Hazen Road corridor in east-central Walden.",fill:"#E67E22","fill-opacity":.12,stroke:"#E67E22","stroke-width":1.5,"stroke-opacity":.6,source:"H.F. Walling, Map of Caledonia County VT, 1858"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.249,44.4762]},properties:{name:"Methodist Church — Noyesville (built 1856, shown on 1858 map)",category:"Church — Adjacent to School District No. 1",map_year:"1858",description:"Methodist Church at Noyesville, built 1856, appearing on the 1858 Walling map. In 19th-century Vermont, the church and school often shared the same building or adjacent lots. Religious instruction was part of the school curriculum. The Methodist Church at Noyesville was the newest building in Walden when the map was surveyed. The Kittridge families in eastern Walden would have attended this church and its associated school.","marker-color":"#8E44AD","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.245,44.5056]},properties:{name:"Congregational Church — North Walden (organized 1805, on 1858 map)",category:"Church — Adjacent to School District No. 3",map_year:"1858",description:"First church in Walden, organized 1805 by Deacon Theophilus Rundlet. Located at North Walden adjacent to the North Walden school. The church building was also used for town meetings, school committee meetings, and other civic gatherings. Still active and documented on the 1858 Walling map.","marker-color":"#8E44AD","marker-size":"medium",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.244,44.44]},properties:{name:"South Walden Cemetery — near School District No. 4",category:"Cemetery (near school)",map_year:"1858",description:"South Walden Cemetery, established by 1858. Located near School District No. 4. Vermont district schools were typically sited near a cemetery, church, or crossroads for community access. Many Walden schoolchildren in 1858 had family buried in these nearby cemeteries.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",adjacent_school_district:"No. 4"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.245,44.507]},properties:{name:"North Walden Cemetery — near School District No. 3",category:"Cemetery (near school)",map_year:"1858",description:"North Walden Cemetery, established by 1858. Located near School District No. 3. Vermont district schools were typically sited near a cemetery, church, or crossroads for community access. Many Walden schoolchildren in 1858 had family buried in these nearby cemeteries.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",adjacent_school_district:"No. 3"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.218,44.479]},properties:{name:"Walden Heights Cemetery — near School District No. 5",category:"Cemetery (near school)",map_year:"1858",description:"Walden Heights Cemetery, established by 1858. Located near School District No. 5. Vermont district schools were typically sited near a cemetery, church, or crossroads for community access. Many Walden schoolchildren in 1858 had family buried in these nearby cemeteries.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",adjacent_school_district:"No. 5"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.266,44.473]},properties:{name:"Noyesville Cemetery — near School District No. 1",category:"Cemetery (near school)",map_year:"1858",description:"Noyesville Cemetery, established by 1858. Located near School District No. 1. Vermont district schools were typically sited near a cemetery, church, or crossroads for community access. Many Walden schoolchildren in 1858 had family buried in these nearby cemeteries.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",adjacent_school_district:"No. 1"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.252,44.462]},properties:{name:"Orton Cemetery — near School District No. 2",category:"Cemetery (near school)",map_year:"1858",description:"Orton Cemetery, established by 1858. Located near School District No. 2. Vermont district schools were typically sited near a cemetery, church, or crossroads for community access. Many Walden schoolchildren in 1858 had family buried in these nearby cemeteries.","marker-color":"#555555","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",adjacent_school_district:"No. 2"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.23,44.47]},properties:{name:"★ 1186 Cahoon Farm Rd — Reference Point (County Road, 1858)",category:"Reference Point",map_year:"1858",description:"Modern address 1186 Cahoon Farm Rd, Walden, VT. In 1858 this was the 'County Road' — the Bayley-Hazen Military Road corridor. The property sits between School District No. 2 (Four Corners) and No. 5 (Walden Heights) service areas. The Kittredge/Kittridge family farm properties documented in the 1850 census (pages 289–296) are geographically centered near this location. Lyman O. Kittredge (1850 census pg.296) is the most likely candidate to appear by name on the 1858 Walling map near Cahoon Farm Road.","marker-color":"#FFD700","marker-size":"large",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census",note:"Closest Kittredge family member to this location: Lyman O. Kittredge (pg.296)"}},{type:"Feature",geometry:{type:"Point",coordinates:[-72.265,44.415]},properties:{name:"Vermont Common School System Context — 1858",category:"Historical Context",map_year:"1858",description:"VERMONT COMMON SCHOOL SYSTEM (1858 context): Vermont's 1827 Common School Act required each town to maintain school districts with schoolhouses within walking distance of all children. By 1858 Walden (pop. 910) had at minimum 5–6 school districts. Each one-room schoolhouse served 10–25 pupils of all ages. School terms were typically 2–3 months in winter (for older students freed from farm work) and 2–3 months in summer (for younger children). Teachers were often young women earning $1.50–$2.00/week plus board. The 1858 H.F. Walling map shows school symbols at each documented location. KITTREDGE FAMILY SCHOOL ATTENDANCE (1858 estimate): Henry Kittridge (~14), Luella Kittridge (~11) — District No. 1 (Noyesville); Elisabeth Kittridge (~15) — District No. 1 (Noyesville); Louisa Kittridge (~12) — District No. 4 (South Walden); Children of Lyman O. Kittredge (unknown names, ~school age) — District No. 2.","marker-color":"#2E86C1","marker-size":"small",source:"H.F. Walling, Map of Caledonia County VT, 1858; VTGenWeb Walden Index; 1850 US Census"}}]},{type:"FeatureCollection",name:"Elevation Zones — 50mi Radius of 44.475N -72.247W (Walden VT) — Felt Upload",features:[{type:"Feature",geometry:{type:"Polygon",coordinates:[[[-73.45,44.2],[-73.55,44.4],[-73.6,44.6],[-73.55,44.8],[-73.45,44.95],[-73.3,44.9],[-73.2,44.7],[-73.25,44.5],[-73.15,44.3],[-73.2,44.15],[-73.35,44.1],[-73.45,44.2]]]},properties:{name:"Lake Champlain Lowlands — Elevation < 500 ft",elevation_range_ft:"Below 500 ft",elevation_range_m:"Below 152 m",approximate_elevation_ft:"95–480 ft",terrain_type:"Lake surface, river floodplains, Champlain Valley farmland",historical_significance:"Lake Champlain (95 ft elevation) was the primary water highway for the Royalton Raid advance and withdrawal (Oct 1780). British/Mohawk raiders canoed south on the lake before entering the Winooski River. The lake's low elevation made it the fastest travel corridor in the region — soldiers could co         // Pipeline processing engine: Combines independent GeoJSON elements
        function combineGeoJsonObjects(arrayOfObjects) {
            let combinedFeatures = [];
            arrayOfObjects.forEach(obj => {
                if (!obj) return;
                if (obj.type === "Feature") {
                    combinedFeatures.push(obj);
                } else if (obj.type === "FeatureCollection" && Array.isArray(obj.features)) {
                    combinedFeatures = combinedFeatures.concat(obj.features);
                }
            });
            return {
                "type": "FeatureCollection",
                "features": combinedFeatures
            };
        }

                if (map.getLayer(`${id}-lines`)) map.removeLayer(`${id}-lines`);
                if (map.getLayer(`${id}-points`)) map.removeLayer(`${id}-points`);
                map.removeSource(id);
            }

            map.addSource(id, {
                type: 'geojson',
                data: geojsonData
            });

            // Points Layer parsing dynamic properties
            map.addLayer({
                id: `${id}-points`,
                type: 'circle',
                source: id,
                filter: ['==', '$type', 'Point'],
                paint: {
                    'circle-color': ['coalesce', ['get', 'marker-color'], '#ff0055'],
                    'circle-radius': [
                        'match', ['get', 'marker-size'],
                        'small', 4,
                        'medium', 7,
                        'large', 10,
                        6
                    ],
                    'circle-stroke-width': 1.5,
                    'circle-stroke-color': '#ffffff'
                }
            });

            // Map Popup Click Binding
            map.on('click', `${id}-points`, (e) => {
                const coordinates = e.features[0].geometry.coordinates.slice();
                const props = e.features[0].properties;
                
                const name = props.name || "Unnamed Location";
                const description = props.description || "No description provided.";

                new maplibregl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(`
                        <div class="popup-title">${name}</div>
                        <div class="popup-desc">${description}</div>
                    `)
                    .addTo(map);
            });

            map.on('mouseenter', `${id}-points`, () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', `${id}-points`, () => { map.getCanvas().style.cursor = ''; });
        }

        // --- 6. Viewport Framing Helpers ---
        function autoFrameToFeatures(geojsonData) {
            const coordinates = [];
            geojsonData.features.forEach(f => {
                if (f.geometry && f.geometry.type === 'Point') {
                    coordinates.push(f.geometry.coordinates);
                }
            });
            
            if (coordinates.length > 0) {
                const bounds = coordinates.reduce((acc, coord) => {
                    return acc.extend(coord);
                }, new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));
                
                map.fitBounds(bounds, { padding: 60, maxZoom: 18 });
            }
        }
    </script>
</body>
</html>
